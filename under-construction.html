<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Construction</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f5f5, #e9dfe3);
            font-family: Arial, sans-serif;
            color: #1d1d1d;
        }
        .message-card {
            width: min(90vw, 640px);
            background: #ffffff;
            border: 2px solid #a31f34;
            border-radius: 18px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }
        h1 {
            margin: 0 0 16px;
            font-size: clamp(2rem, 5vw, 3rem);
            color: #a31f34;
        }
        p {
            margin: 0;
            font-size: clamp(1rem, 2vw, 1.35rem);
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 24px;
            color: #ffffff;
            background: #a31f34;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="message-card">
        <h1 id="title">Still working on this section</h1>
        <p id="detail">This page is currently under construction.</p>
        <a href="/index.html">Back to Home</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const section = params.get('section');
        const title = document.getElementById('title');
        const detail = document.getElementById('detail');

        if (section) {
            title.textContent = `Still working on the ${section} section`;
            detail.textContent = `The ${section} page is currently being built.`;
        }
    </script>
</body>
</html>
